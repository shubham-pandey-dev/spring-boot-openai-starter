spring.application.name=starter

# Select AI provider (openai or deepseek)
spring.ai.model.chat=${AI_PROVIDER:openai}

# OpenAI configuration
spring.ai.openai.chat.model=gpt-6-luna
spring.ai.openai.api-key=${OPENAI_API_KEY}

# DeepSeek configuration
spring.ai.deepseek.chat.model=deepseek-chat
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}

# Environment configuration
spring.config.import=file:./.env[.properties][encoding=utf-8]